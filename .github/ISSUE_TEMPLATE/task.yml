name: Task
description: 小功能或 Parent Feature 的实施 sub-issue。一个会话能做完。
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: |
        一个 issue 对应一条分支和一个 PR。
        Parent Feature 的 Task 使用 GitHub 原生 sub-issue 关系关联。
        从 Research 产生的 Task 用 `blocked by` 指向 Research issue。
        标题写成「动词 对象」。
        UI issue 写可判断的验收标准和表现预期。
        真机截图写在实现后的 PR 的 `Visual verification`。
        验收规则见 [研发工作流](../../docs/process/workflow.md) 的 S5 与 Visual verification。

  - type: textarea
    id: goal
    attributes:
      label: 目标
      description: 交付后用户能做什么。不写实现细节。
    validations:
      required: true

  - type: textarea
    id: expectation
    attributes:
      label: 表现预期
      description: |
        写用户可观察的界面变化，一行一条。
        没有 UI 变化时填「无」。
      placeholder: |
        - <界面变化一：可判断的描述>
        - <界面变化二：可判断的描述>
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 一行一条。每条必须可判定。
      placeholder: |
        - 验收：<可判断的结果>
        - 验收：<可判断的结果>
    validations:
      required: true

  - type: dropdown
    id: estimated_days
    attributes:
      label: 预计工期
      options:
        - 1 天
        - 2 天
        - 3 天
    validations:
      required: true

  - type: dropdown
    id: ui_type
    attributes:
      label: UI 类型
      description: 选择本 issue 的 UI 类型。UI 代码变更的真机证据在 PR 提供。
      options:
        - 不涉及 UI
        - UI 决策
        - UI 代码变更
    validations:
      required: true

  - type: textarea
    id: preview
    attributes:
      label: 预览
      description: |
        仅 UI 决策填写候选方案、截图和评审状态。
        UI 代码变更不在 issue 放 After 截图。
        真机验收证据在 PR 补齐。
      placeholder: |
        - 候选方案：<链接或简短说明>
        - 截图：docs/design/previews/<name>.png
        - 评审：Pending
    validations:
      required: false
