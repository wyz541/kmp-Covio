name: Agent acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/agent-acceptance.yml"
      - "macosApp/src/Agent/AgentAcceptanceVerifier.swift"
      - "scripts/verify-agent-bundle.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constrained-macos:
    name: Constrained Agent Apple Silicon
    runs-on: macos-26
    timeout-minutes: 60
    env:
      COVIO_FILE_NAMING_MODEL_DIR: ${{ github.workspace }}/build/agent-model
    steps:
      - uses: actions/checkout@v4

      - name: Record hardware
        run: |
          system_profiler SPHardwareDataType | sed -n '1,80p'
          printf 'physical_memory_bytes='
          sysctl -n hw.memsize

      - name: Download the fixed model
        run: python3 -I scripts/file_naming_model.py download "$COVIO_FILE_NAMING_MODEL_DIR"

      - name: Package the app
        run: bash scripts/package-macos-swift.sh

      - name: Free build inputs
        run: |
          find "$COVIO_FILE_NAMING_MODEL_DIR" -depth -delete
          find build/xcode-archive -depth -delete
          find dist -maxdepth 1 -type f -name 'Covio-*.dmg' -delete
          df -h /

      - name: Run Agent acceptance
        shell: bash
        run: |
          set -o pipefail
          bash scripts/verify-agent-bundle.sh dist/Covio.app \
            2>&1 | tee "$RUNNER_TEMP/agent-acceptance.log"

      - name: Upload the acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/agent-acceptance.log
          if-no-files-found: ignore
          retention-days: 30
