name: Agent tool research

on:
  pull_request:
    paths:
      - ".github/workflows/agent-tool-research.yml"
      - "macosApp/test/AgentToolCallingIntegrationTests.swift"
      - "scripts/test-agent-tool-calling.sh"

permissions:
  contents: read

jobs:
  tool-matrix:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      COVIO_FILE_NAMING_MODEL_DIR: ${{ github.workspace }}/build/agent-tool-model
      COVIO_AGENT_TOOL_RESULTS_PATH: ${{ github.workspace }}/build/agent-tool-results.json
    steps:
      - uses: actions/checkout@v4

      - name: Download the fixed model
        run: python3 -I scripts/file_naming_model.py download "$COVIO_FILE_NAMING_MODEL_DIR"

      - name: Run the tool matrix
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-agent-tool-calling.sh 2>&1 | tee build/agent-tool-test.log

      - name: Upload research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-tool-research-${{ github.run_id }}
          path: |
            build/agent-tool-results.json
            build/agent-tool-test.log
          if-no-files-found: ignore
          retention-days: 30
