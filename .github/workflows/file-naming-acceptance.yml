name: File naming hardware acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/file-naming-acceptance.yml"
      - "macosApp/src/AutoNaming/FileNamingAcceptanceVerifier.swift"
      - "scripts/verify-file-naming-bundle.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  constrained-macos:
    name: Constrained Apple Silicon
    # GitHub 的 macos-26 运行器是 M1，3 核、7 GB 内存。
    # 7 GB 是低于 8 GB 产品门槛的约束测试。
    runs-on: macos-26
    timeout-minutes: 60
    env:
      COVIO_FILE_NAMING_MODEL_DIR: ${{ runner.temp }}/file-naming-model
      COVIO_FILE_NAMING_ACCEPTANCE_MIN_MEMORY_BYTES: "7516192768"
    steps:
      - uses: actions/checkout@v4

      - name: Record hardware
        run: |
          system_profiler SPHardwareDataType | sed -n '1,80p'
          printf 'physical_memory_bytes='
          sysctl -n hw.memsize

      - name: Download the fixed model
        run: python3 -I scripts/file_naming_model.py download "$COVIO_FILE_NAMING_MODEL_DIR"

      - name: Package the app
        run: bash scripts/package-macos-swift.sh

      - name: Free build inputs
        run: |
          find "$COVIO_FILE_NAMING_MODEL_DIR" -depth -delete
          find build/xcode-archive -depth -delete
          find dist -maxdepth 1 -type f -name 'Covio-*.dmg' -delete
          df -h /

      - name: Run the 12-sample acceptance
        shell: bash
        run: |
          set -o pipefail
          COVIO_FILE_NAMING_ACCEPTANCE=1 \
            bash scripts/verify-file-naming-bundle.sh dist/Covio.app \
            | tee "$RUNNER_TEMP/file-naming-acceptance.log"

      - name: Upload the acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: file-naming-acceptance-${{ github.run_id }}
          path: ${{ runner.temp }}/file-naming-acceptance.log
          if-no-files-found: ignore
          retention-days: 30
